      - name: Resumo dos erros (só se falhar)
        if: failure()
        working-directory: android
        run: |
          gradle assembleDebug --console=plain > ../erros.log 2>&1 || true
          echo "===== ERROS KOTLIN/JAVA ====="
          grep -E "^e: |: error:" ../erros.log | head -60 || true
          echo "===== RECURSOS / MANIFESTO ====="
          grep -E "AAPT|Manifest merger failed|error: resource|Resource .* not found" ../erros.log | head -30 || true
          echo "===== GRADLE ====="
          grep -A 12 "What went wrong" ../erros.log | head -40 || true
