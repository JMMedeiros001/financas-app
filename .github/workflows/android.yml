
name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto KUPA
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/kupa-projeto.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::kupa-projeto.zip não encontrado na raiz."
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TEMP_DIR"

          if [ -f "$TEMP_DIR/kupa/android/settings.gradle.kts" ]; then
            ROOT="$TEMP_DIR/kupa"
          elif [ -f "$TEMP_DIR/android/settings.gradle.kts" ]; then
            ROOT="$TEMP_DIR"
          else
            echo "::error::Projeto Android não encontrado dentro do ZIP."
            find "$TEMP_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          for item in android backend README.md README_BACKEND.md render.yaml; do
            if [ -e "$ROOT/$item" ]; then
              rm -rf "$GITHUB_WORKSPACE/$item"
              cp -a "$ROOT/$item" "$GITHUB_WORKSPACE/$item"
            fi
          done

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

          echo "Projeto KUPA extraído."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK Android configurado."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnosticar ambiente
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "========== CONFIGURAÇÃO DO PROJETO =========="
          cat android/build.gradle.kts
          cat android/app/build.gradle.kts
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Validar configuração Gradle
        working-directory: android
        shell: bash
        run: |
          set -o pipefail

          gradle tasks \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee ../kupa-config.log

      - name: Compilar APK Debug
        working-directory: android
        shell: bash
        run: |
          set +e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee ../kupa-build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "========== ERRO PRINCIPAL =========="

          grep -n -B 8 -A 15 -E \
            "What went wrong|Compilation error|e: file:|error:|Unresolved reference|Could not resolve|Android resource linking failed|Manifest merger failed|Caused by:" \
            ../kupa-build.log | tail -160 || true

          exit "$RESULT"

      - name: Verificar APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

          echo "APK gerado e validado."

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-build-diagnostics
          path: |
            kupa-config.log
            kupa-build.log
          if-no-files-found: ignore
          retention-days: 7
