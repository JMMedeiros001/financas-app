name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-kupa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesma versão do android/gradle/wrapper/gradle-wrapper.properties e o mínimo exigido pelo Android Gradle Plugin 8.7.3.
  GRADLE_VERSION: '8.9'
  ANDROID_PLATFORM: 'android-35'
  # AGP 8.7.x usa build-tools 34.0.0 por padrão; o 35.0.0 é instalado também por garantia.
  BUILD_TOOLS_DEFAULT: '34.0.0'
  BUILD_TOOLS_NEWEST: '35.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto KUPA (limpo e verificado)
        run: |
          set -euo pipefail

          if [ ! -f kupa-projeto.zip ]; then
            echo "::error::kupa-projeto.zip não está na raiz do repositório."
            ls -la
            exit 1
          fi

          # Remove restos de versões antigas: o "cp -a" só acrescenta/sobrescreve, nunca apaga o que saiu do projeto.
          rm -rf /tmp/kupa-extract android backend docs tools render.yaml
          unzip -q kupa-projeto.zip -d /tmp/kupa-extract

          if [ -d /tmp/kupa-extract/kupa/android ]; then
            SRC=/tmp/kupa-extract/kupa
          elif [ -d /tmp/kupa-extract/android ]; then
            SRC=/tmp/kupa-extract
          else
            echo "::error::O zip não tem a pasta android/ (nem em kupa/android nem na raiz). Conteúdo:"
            find /tmp/kupa-extract -maxdepth 2
            exit 1
          fi
          cp -a "$SRC"/. .

          for f in android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts \
                   android/app/src/main/AndroidManifest.xml android/gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then
              echo "::error::Arquivo obrigatório ausente no projeto: $f"
              exit 1
            fi
          done

          echo "Projeto extraído de: $SRC"
          echo "Arquivos Kotlin: $(find android -name '*.kt' | wc -l) | Java: $(find android -name '*.java' | wc -l)"
          if [ -f android/gradlew ]; then
            echo "gradlew presente: sim"
          else
            echo "gradlew presente: NÃO (esperado). O workflow usa o Gradle ${GRADLE_VERSION} instalado pela action."
          fi
          grep '^distributionUrl' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar o Android SDK pré-instalado do runner
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK não encontrado em: $SDK"
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado no runner."
            ls -la "$SDK" "$SDK/cmdline-tools" 2>&1 || true
            exit 1
          fi

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"

          echo "SDK: $SDK"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Aceitar licenças do Android SDK (e verificar)
        run: |
          set -uo pipefail

          # "yes | sdkmanager" termina com SIGPIPE no "yes" (código 141) assim que o sdkmanager para de ler.
          # Isso é normal. Por isso NÃO usamos o código do pipeline: lemos o código do próprio sdkmanager.
          yes | "$SDKMANAGER" --licenses > /tmp/licencas.log 2>&1
          RC=${PIPESTATUS[1]}
          tail -n 8 /tmp/licencas.log

          if [ "$RC" -ne 0 ]; then
            echo "::error::sdkmanager --licenses terminou com código $RC."
            cat /tmp/licencas.log
            exit 1
          fi
          # Prova de que as licenças estão registradas (é isso que o Gradle exige para baixar/usar componentes).
          if [ ! -s "$ANDROID_HOME/licenses/android-sdk-license" ]; then
            echo "::error::A licença android-sdk-license não ficou registrada em $ANDROID_HOME/licenses."
            ls -la "$ANDROID_HOME/licenses" 2>&1 || true
            exit 1
          fi
          echo "Licenças registradas:"
          ls -la "$ANDROID_HOME/licenses"

      - name: Garantir os componentes do SDK (instala só se faltar)
        run: |
          set -euo pipefail

          need() { # $1 = pacote do sdkmanager, $2 = pasta esperada
            if [ -d "$ANDROID_HOME/$2" ]; then
              echo "OK (já instalado): $1"
            else
              echo "Instalando: $1"
              "$SDKMANAGER" --install "$1"
            fi
          }
          need "platform-tools" "platform-tools"
          need "platforms;${ANDROID_PLATFORM}" "platforms/${ANDROID_PLATFORM}"
          need "build-tools;${BUILD_TOOLS_DEFAULT}" "build-tools/${BUILD_TOOLS_DEFAULT}"
          need "build-tools;${BUILD_TOOLS_NEWEST}" "build-tools/${BUILD_TOOLS_NEWEST}"

          "$SDKMANAGER" --list_installed > /tmp/instalados.txt 2>&1
          grep -E "platforms;${ANDROID_PLATFORM}|build-tools;${BUILD_TOOLS_DEFAULT}" /tmp/instalados.txt

      - name: Configurar Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Diagnóstico do ambiente
        run: |
          echo "== Java =="; java -version 2>&1
          echo "== Gradle =="; gradle --version
          echo "== SDK =="; echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          echo "== Recursos =="; free -m; df -h . | tail -n 1

      - name: Validar scripts Gradle (configuração do projeto)
        working-directory: android
        run: |
          set -euo pipefail
          gradle help --no-daemon --console=plain --stacktrace

      - name: Compilar APK Debug
        working-directory: android
        run: |
          # pipefail garante que o código de saída do Gradle (e não o do tee) decide se o passo falha.
          set -euo pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Resumo da causa da falha
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-build.log"
          if [ ! -f "$LOG" ]; then
            echo "A falha foi ANTES da compilação (veja o passo que ficou vermelho acima)."
            exit 0
          fi

          {
            echo "## Por que o build falhou"
            echo
            echo "### Erros de compilação Kotlin/Java (linhas \`e:\` e \`error:\`)"
            echo '```'
            grep -E '^e: |: error: ' "$LOG" | sed 's#file://##' | head -n 40 || true
            echo '```'
            echo
            echo "### Recursos e manifesto (AAPT2 / merger)"
            echo '```'
            grep -E 'AAPT|Manifest merger failed|error: resource|Resource .* not found|Android resource linking failed' "$LOG" | head -n 20 || true
            echo '```'
            echo
            echo "### Resumo do Gradle (What went wrong)"
            echo '```'
            grep -A 14 'What went wrong' "$LOG" | head -n 40 || true
            echo '```'
            echo
            echo "### Classificação automática (só indica pistas)"
            grep -qE '^e: ' "$LOG" && echo "- Erro de compilação Kotlin: corrija as linhas e: acima."
            grep -qE 'Could not resolve|Could not GET|Connection timed out|Read timed out' "$LOG" && echo "- Falha de download de dependências/plugins (rede ou repositório)."
            grep -qE 'OutOfMemoryError|Java heap space|GC overhead' "$LOG" && echo "- Falta de memória na compilação."
            grep -qE 'SDK location not found|Failed to install the following|You have not accepted the license|licenses? have not been accepted' "$LOG" && echo "- Problema com Android SDK ou licenças."
            grep -qE 'Unsupported class file major version|requires Java|Unsupported Java' "$LOG" && echo "- Versão de Java incompatível."
            grep -qE 'Minimum supported Gradle version|incompatible with.*Gradle' "$LOG" && echo "- Versão do Gradle incompatível com o Android Gradle Plugin."
            true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verificar o APK gerado
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"

          # 1) o ZIP do APK está íntegro?
          unzip -tq "$APK"
          # 2) tem código e manifesto?
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -E 'classes\.dex$' /tmp/apk-list.txt
          grep -E 'AndroidManifest\.xml$' /tmp/apk-list.txt
          # 3) é o app certo?
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          grep "package: name='com.kupa.assistant'" /tmp/badging.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-logs-de-build
          path: |
            gradle-build.log
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
