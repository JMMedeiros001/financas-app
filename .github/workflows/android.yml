
name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kupa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto KUPA
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP="$GITHUB_WORKSPACE/kupa-projeto.zip"

          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Não encontrei kupa-projeto.zip na raiz do repositório."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/kupa-extraido"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          if [[ -f "$EXTRACT_DIR/kupa/android/settings.gradle.kts" ]]; then
            PROJECT_ROOT="$EXTRACT_DIR/kupa"
          elif [[ -f "$EXTRACT_DIR/android/settings.gradle.kts" ]]; then
            PROJECT_ROOT="$EXTRACT_DIR"
          else
            echo "::error::O ZIP não contém android/settings.gradle.kts na raiz esperada."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -250
            exit 1
          fi

          for item in android backend README.md README_BACKEND.md render.yaml; do
            if [[ -e "$PROJECT_ROOT/$item" ]]; then
              rm -rf "$GITHUB_WORKSPACE/$item"
              cp -a "$PROJECT_ROOT/$item" "$GITHUB_WORKSPACE/$item"
            fi
          done

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

          echo "Estrutura Android encontrada."
          find android -maxdepth 4 -type f \( -name '*.gradle.kts' -o -name 'gradle-wrapper.properties' -o -name 'gradlew' \) -print | sort

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças Android
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          sdkmanager --list_installed

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Diagnosticar ambiente e configuração
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '=== JAVA ==='
            java -version
            echo '=== GRADLE ==='
            gradle --version
            echo '=== ANDROID SDK ==='
            echo "ANDROID_HOME=${ANDROID_HOME:-não definido}"
            sdkmanager --list_installed
            echo '=== VERSÕES DOS PLUGINS ==='
            grep -nE 'com.android.application|org.jetbrains.kotlin.android' android/build.gradle.kts
            echo '=== WRAPPER ==='
            if [[ -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
              cat android/gradle/wrapper/gradle-wrapper.properties
            else
              echo 'Sem wrapper; usando Gradle instalado pelo workflow.'
            fi
            echo '=== URL DO BACKEND ==='
            grep -n '^KUPA_BACKEND_URL=' android/kupa.properties || true
          } 2>&1 | tee kupa-environment.log

      - name: Validar configuração Gradle
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          gradle help --no-daemon --stacktrace --info 2>&1 | tee ../kupa-config.log
          result=${PIPESTATUS[0]}
          set -e

          if [[ $result -ne 0 ]]; then
            echo '=== ERROS IMPORTANTES DA CONFIGURAÇÃO ==='
            grep -n -B 5 -A 12 -Ei 'What went wrong:|^\* What went wrong|^e: |^error:|Could not |A problem occurred|Caused by:|invalid|exception' ../kupa-config.log | head -220 || true
            exit "$result"
          fi

      - name: Compilar APK Debug
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --info --warning-mode all 2>&1 | tee ../kupa-build.log
          result=${PIPESTATUS[0]}
          set -e

          if [[ $result -ne 0 ]]; then
            echo '::error::A compilação falhou. Mensagens relevantes abaixo; o log completo será publicado como artefato.'
            grep -n -B 6 -A 18 -Ei '^\* What went wrong:|^What went wrong:|^e: |^error:|Compilation error|Unresolved reference|Could not resolve|Could not find|Execution failed for task|Caused by:|^BUILD FAILED' ../kupa-build.log | head -300 || true
            exit "$result"
          fi

      - name: Verificar APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Gradle terminou sem gerar um APK válido em $APK"
            exit 1
          fi

          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          echo 'APK gerado e arquivo íntegro.'

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-build-diagnostics
          path: |
            kupa-environment.log
            kupa-config.log
            kupa-build.log
          if-no-files-found: ignore
          retention-days: 7
