
name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kupa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KUPA Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto KUPA
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/kupa-projeto.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Arquivo kupa-projeto.zip não encontrado na raiz do repositório."
            exit 1
          fi

          EXTRACT_DIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          if [ -f "$EXTRACT_DIR/kupa/android/settings.gradle.kts" ]; then
            PROJECT_ROOT="$EXTRACT_DIR/kupa"
          elif [ -f "$EXTRACT_DIR/android/settings.gradle.kts" ]; then
            PROJECT_ROOT="$EXTRACT_DIR"
          else
            echo "::error::Estrutura Android não encontrada dentro do ZIP."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          for item in android backend README.md README_BACKEND.md render.yaml; do
            if [ -e "$PROJECT_ROOT/$item" ]; then
              rm -rf "$GITHUB_WORKSPACE/$item"
              cp -a "$PROJECT_ROOT/$item" "$GITHUB_WORKSPACE/$item"
            fi
          done

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

          echo "Projeto KUPA extraído com sucesso."
          ls -la android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Localizar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças Android
        shell: bash
        run: |
          set -u

          echo "Aceitando licenças do Android SDK..."

          # O comando yes pode terminar com SIGPIPE quando o sdkmanager
          # fecha a entrada após aceitar as licenças. Isso não deve
          # interromper o workflow se as licenças foram aceitas.
          yes | sdkmanager --licenses >/tmp/kupa-sdk-licenses.log 2>&1 || true

          cat /tmp/kupa-sdk-licenses.log

          if ! sdkmanager --list_installed >/tmp/kupa-sdk-installed.log 2>&1; then
            cat /tmp/kupa-sdk-installed.log
            echo "::error::Não foi possível consultar os componentes do Android SDK."
            exit 1
          fi

          echo "Licenças verificadas."

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Componentes instalados:"
          sdkmanager --list_installed

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Diagnosticar ambiente
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

          echo "=== Android SDK ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-não definido}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-não definido}"

          echo "=== Configuração dos plugins ==="
          grep -nE 'com.android.application|org.jetbrains.kotlin.android' \
            android/build.gradle.kts

          echo "=== Configuração do SDK do projeto ==="
          grep -nE 'compileSdk|minSdk|targetSdk' \
            android/app/build.gradle.kts || true

          echo "=== Wrapper Gradle ==="
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "Wrapper ausente; será usado o Gradle instalado pelo workflow."
          fi

      - name: Validar configuração Gradle
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle tasks --no-daemon --stacktrace 2>&1 | tee ../kupa-config.log

      - name: Compilar APK Debug
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee ../kupa-build.log

      - name: Verificar APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK não encontrado ou arquivo vazio: $APK"
            exit 1
          fi

          echo "=== APK gerado ==="
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null

          echo "APK validado com sucesso."

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-build-diagnostics
          path: |
            kupa-config.log
            kupa-build.log
            /tmp/kupa-sdk-licenses.log
            /tmp/kupa-sdk-installed.log
          if-no-files-found: ignore
          retention-days: 7
