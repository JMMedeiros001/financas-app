
name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto KUPA
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/kupa-projeto.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::kupa-projeto.zip não encontrado na raiz do repositório."
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TEMP_DIR"

          if [ -f "$TEMP_DIR/kupa/android/settings.gradle.kts" ]; then
            ROOT="$TEMP_DIR/kupa"
          elif [ -f "$TEMP_DIR/android/settings.gradle.kts" ]; then
            ROOT="$TEMP_DIR"
          else
            echo "::error::Estrutura Android não encontrada no ZIP."
            find "$TEMP_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          for item in android backend README.md README_BACKEND.md render.yaml; do
            if [ -e "$ROOT/$item" ]; then
              rm -rf "$GITHUB_WORKSPACE/$item"
              cp -a "$ROOT/$item" "$GITHUB_WORKSPACE/$item"
            fi
          done

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

          echo "Projeto KUPA extraído com sucesso."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verificar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Diretório do Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado no runner."
            find "$ANDROID_HOME" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          "$SDKMANAGER" --list_installed

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Diagnosticar ambiente
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          echo "========== CONFIGURAÇÃO ANDROID =========="
          cat android/build.gradle.kts
          cat android/app/build.gradle.kts

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Validar configuração Gradle
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle tasks --no-daemon --stacktrace --info 2>&1 \
            | tee ../kupa-config.log

      - name: Compilar APK Debug
        working-directory: android
        shell: bash
        run: |
          set +e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all 2>&1 | tee ../kupa-build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "========== RESUMO DO ERRO =========="

          grep -n -B 5 -A 12 -E \
            "What went wrong|Compilation error|e: file:|Unresolved reference|Could not resolve|Execution failed|Android resource linking failed|Manifest merger failed" \
            ../kupa-build.log | tail -150 || true

          exit "$RESULT"

      - name: Verificar APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::O APK não foi gerado."
            exit 1
          fi

          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          echo "APK gerado e validado."

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-build-diagnostics
          path: |
            kupa-config.log
            kupa-build.log
          if-no-files-found: ignore
          retention-days: 7
