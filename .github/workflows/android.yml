name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto KUPA
        run: |
          set -e

          unzip -q kupa-projeto.zip -d /tmp/kupa

          if [ -d "/tmp/kupa/kupa" ]; then
            cp -a /tmp/kupa/kupa/. .
          else
            cp -a /tmp/kupa/. .
          fi

          echo "Projeto extraído."
          ls -la
          ls -la android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verificar projeto Android
        working-directory: android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Projeto KUPA Android encontrado."

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
