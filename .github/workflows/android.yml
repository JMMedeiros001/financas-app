name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Encontrar e preparar projeto KUPA
        run: |
          set -e

          if [ -f "kupa-projeto.zip" ]; then
            echo "Encontrado kupa-projeto.zip"
            unzip -q kupa-projeto.zip -d /tmp/kupa
            rm -f kupa-projeto.zip

            if [ -d "/tmp/kupa/kupa-projeto" ]; then
              cp -a /tmp/kupa/kupa-projeto/. .
            else
              cp -a /tmp/kupa/. .
            fi
          fi

          echo "Estrutura encontrada:"
          find . -maxdepth 3 \
            -not -path "./.git" \
            -not -path "./.git/*" \
            -type f | sort | head -300

      - name: Verificar projeto
        run: |
          if [ -f "package.json" ]; then
            echo "Projeto JavaScript/TypeScript encontrado."
          elif [ -f "pubspec.yaml" ]; then
            echo "Projeto Flutter encontrado."
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Projeto Android nativo encontrado."
          else
            echo "::error::Não foi possível identificar automaticamente o projeto KUPA."
            exit 1
          fi

      - name: Configurar Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install

      - name: Compilar projeto web
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build

      - name: Instalar Capacitor
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Compilar APK
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            ./gradlew assembleDebug
          else
            echo "::error::Gradle/Android não foi encontrado."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
