name: Build KUPA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto KUPA
        run: |
          set -e

          if [ -f "kupa-projeto.zip" ]; then
            echo "Encontrado kupa-projeto.zip"
            rm -rf /tmp/kupa
            mkdir -p /tmp/kupa

            unzip -q kupa-projeto.zip -d /tmp/kupa

            echo "Conteúdo extraído:"
            find /tmp/kupa -maxdepth 3 -type f | sort

            if [ -d "/tmp/kupa/kupa" ]; then
              cp -a /tmp/kupa/kupa/. .
            else
              cp -a /tmp/kupa/. .
            fi
          fi

      - name: Verificar projeto Android
        run: |
          set -e

          if [ ! -f "android/settings.gradle.kts" ]; then
            echo "::error::android/settings.gradle.kts não encontrado."
            echo "Estrutura encontrada:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "::error::android/app/build.gradle.kts não encontrado."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew não encontrado."
            exit 1
          fi

          echo "Projeto KUPA Android encontrado."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK não foi gerado."
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: KUPA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
